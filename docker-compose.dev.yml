# Dev database only. Run: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fleethub
      POSTGRES_PASSWORD: fleethub
      POSTGRES_DB: fleethub
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleethub']
      interval: 5s
      retries: 10

volumes:
  pgdata-dev:
